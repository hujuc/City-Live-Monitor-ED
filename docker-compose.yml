services:

  # ---------------------------------------------------------------------------
  # Message broker — Kafka (KRaft mode, no ZooKeeper since cp-kafka 8.x)
  # Used by: 311 noise complaint stream producer/consumer
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:8.2.0
    ports:
      - "9092:9092"   # external (host)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Fixed cluster ID — required for KRaft storage format on first boot
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Object storage — MinIO (S3-compatible)
  # Stores bronze/silver/gold layer files
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Batch orchestration — Apache Airflow
  # Schedules TLC downloads, silver transforms, gold aggregations
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.1.8-python3.12
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
    ports:
      - "8080:8080"   # Web UI → http://localhost:8080
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      # Airflow 3.x Simple Auth Manager — sets the admin password directly
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: ${AIRFLOW_USER:-admin}:${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ./src/backend/orchestration/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
      - ./infra/airflow_passwords.json:/opt/airflow/simple_auth_manager_passwords.json.generated

  # ---------------------------------------------------------------------------
  # Dashboards — Apache Superset
  # Late-night taxi heatmap, events map, live noise complaint feed
  # ---------------------------------------------------------------------------
  superset-db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      retries: 10

  superset:
    build:
      context: infra/superset
      dockerfile: Dockerfile
    depends_on:
      superset-db:
        condition: service_healthy
    ports:
      - "8088:8088"   # Web UI → http://localhost:8088
    environment:
      DATABASE_URL: postgresql+psycopg2://superset:superset@superset-db/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
      SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    volumes:
      - superset_data:/app/superset_home
      - ./data:/app/gold_data:ro
      - ./infra/superset/bootstrap.sh:/app/bootstrap.sh:ro
      - ./infra/superset/init_gold_views.sql:/app/init_gold_views.sql:ro
      - ./infra/superset/assets.zip:/app/assets.zip:ro

  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # REST API, serves processed data to the frontend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"   # API → http://localhost:8000
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite (uncomment when src/frontend is scaffolded)
  # ---------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: src/frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:80"   # App → http://localhost:5173
  #   depends_on: [backend]

volumes:
  kafka_data:
  minio_data:
  airflow_db:
  airflow_logs:
  superset_db:
  superset_data:
