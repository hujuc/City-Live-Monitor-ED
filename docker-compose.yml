services:

  # ---------------------------------------------------------------------------
  # Message broker — Kafka + Zookeeper
  # Used by: 311 noise complaint stream producer/consumer
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Object storage — MinIO (S3-compatible)
  # Stores bronze/silver/gold layer files
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console → http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Batch orchestration — Apache Airflow
  # Schedules TLC downloads, silver transforms, gold aggregations
  # ---------------------------------------------------------------------------
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.9.3-python3.12
    depends_on:
      airflow-db:
        condition: service_healthy
    ports:
      - "8080:8080"   # Web UI → http://localhost:8080
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-changeme}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    volumes:
      - ./src/backend/orchestration/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs

  # ---------------------------------------------------------------------------
  # Dashboards — Apache Superset
  # Late-night taxi heatmap, events map, live noise complaint feed
  # ---------------------------------------------------------------------------
  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 5s
      retries: 10

  superset:
    image: apache/superset:4.1.1
    depends_on:
      superset-db:
        condition: service_healthy
    ports:
      - "8088:8088"   # Web UI → http://localhost:8088
    environment:
      DATABASE_URL: postgresql+psycopg2://superset:superset@superset-db/superset
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme}
    volumes:
      - superset_data:/app/superset_home

  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # REST API, serves processed data to the frontend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    ports:
      - "8000:8000"   # API → http://localhost:8000
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # ---------------------------------------------------------------------------
  # Frontend — React/Vite (uncomment when src/frontend is scaffolded)
  # ---------------------------------------------------------------------------
  # frontend:
  #   build:
  #     context: src/frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:80"   # App → http://localhost:5173
  #   depends_on: [backend]

volumes:
  zookeeper_data:
  kafka_data:
  minio_data:
  airflow_db:
  airflow_logs:
  superset_db:
  superset_data:
